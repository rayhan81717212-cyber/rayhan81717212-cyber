<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f2027;stop-opacity:1">
        <animate attributeName="stop-color" values="#0f2027;#2c5364;#0f2027" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#2c5364;stop-opacity:1">
        <animate attributeName="stop-color" values="#2c5364;#0f2027;#2c5364" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="url(#grad1)" />

  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle"
    fill="white" font-size="28" font-family="Arial">
    Mohammad Rayhan
  </text>

  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle"
    fill="#00ffff" font-size="18">
    Full Stack Developer
  </text>
</svg>
